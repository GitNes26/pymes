# CataManager (catálogo digital + WhatsApp) — app Express + MySQL 8.
# Uso local:  docker compose up --build
#   - El contenedor MySQL crea la base y el esquema automáticamente la primera
#     vez (monta catamanager-full.sql en /docker-entrypoint-initdb.d).
#   - La app espera a que MySQL esté sano (depends_on + healthcheck).
# En Dokploy/railway normalmente se usa una BD MySQL administrada y solo la app
# desde el Dockerfile; este compose sirve para probar el stack completo.

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cambia-esta-clave-root}
      MYSQL_DATABASE: ${DB_NAME:-catamanager}
      MYSQL_USER: ${DB_USER:-catamanager}
      MYSQL_PASSWORD: ${DB_PASS:-cambia-esta-clave}
    volumes:
      - db_data:/var/lib/mysql
      # Init del esquema (MySQL 8). Solo se ejecuta la primera vez.
      - ./catamanager-full.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-cambia-esta-clave-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-catamanager}
      DB_PASS: ${DB_PASS:-cambia-esta-clave}
      DB_NAME: ${DB_NAME:-catamanager}
      MASTER_KEY: ${MASTER_KEY:-mk-cambia-esta-clave-maestra}
      # URL pública usada en links de compartir/SEO/QR y para forzar el
      # redirect http->https (ver server.js). Debe empezar con https:// —
      # se deja vacía aquí a propósito: este compose es para levantar el
      # stack en localhost (sin TLS), y forzar https rompería esa prueba.
      # En Dokploy sí se define (ver dokploy.json / env.dokploy).
      BASE_URL: ${BASE_URL:-}
      # Subcarpeta exclusiva dentro del volumen compartido de uploads.
      UPLOADS_ROOT: /app/public/uploads
      UPLOADS_PROJECT_NAME: ${UPLOADS_PROJECT_NAME:-catamanager}
    volumes:
      - uploads_data:/app/public/uploads
      - backups_data:/app/backups
    depends_on:
      db:
        condition: service_healthy
    labels:
      # Sin "traefik.enable" Traefik ignora el contenedor; sin el puerto del
      # servicio y el redirect, quedaba sirviendo por http plano en vez de
      # mandar a https (la causa raíz de los enlaces/QR que salían en http).
      - "traefik.enable=true"
      - "traefik.http.services.cadi.loadbalancer.server.port=3000"
      - "traefik.http.routers.cadi.rule=Host(`cadi.nessik.net`)"
      - "traefik.http.routers.cadi.entrypoints=web"
      - "traefik.http.routers.cadi.service=cadi"
      - "traefik.http.routers.cadi.middlewares=cadi-https-redirect"
      - "traefik.http.middlewares.cadi-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.cadi-secure.rule=Host(`cadi.nessik.net`)"
      - "traefik.http.routers.cadi-secure.entrypoints=websecure"
      - "traefik.http.routers.cadi-secure.tls=true"
      - "traefik.http.routers.cadi-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.cadi-secure.service=cadi"

volumes:
  db_data:
  uploads_data:
  backups_data:
